<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>MONOLITH nicht erreichbar</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #090b10;
        color: #f5f7fb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(420px, calc(100vw - 48px));
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        margin-bottom: 24px;
        border-radius: 22px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0 0 28px;
        color: #a9b0bd;
        line-height: 1.55;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: #f5f7fb;
        color: #090b10;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #dfe4ec;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/icon.png" alt="" />
      <h1>MONOLITH ist nicht erreichbar</h1>
      <p>Prüfe, ob du mit deinem Heimnetz verbunden bist.</p>
      <button id="retry" type="button">Erneut versuchen</button>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
